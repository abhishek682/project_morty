openapi: 3.0.3
info:
  title: Rick and Morty API
  version: "1.0.0"
servers:
  - url: http://localhost:8000
paths:
  /characters:
    get:
      summary: List characters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: sort
          schema:
            type: string
            enum: [id, name]
            default: id
      responses:
        "200":
          description: Paginated characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
        "400":
          description: Invalid request
        "429":
          description: Rate limit exceeded
        "503":
          description: Service unavailable
  /healthcheck:
    get:
      summary: Deep health check
      responses:
        "200":
          description: Service healthy
        "503":
          description: Dependencies unhealthy
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics payload
components:
  schemas:
    Character:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        species:
          type: string
        origin_name:
          type: string
        origin_url:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
    PaginatedResponse:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
