name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: rick-morty-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Security scan
        run: bandit -r app

      - name: Unit tests
        run: pytest tests/test_character_service.py

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest

      - name: Create kind cluster
        uses: helm/kind-action@v1.8.0

      - name: Load image into kind
        run: |
          kind load docker-image $IMAGE_NAME:${{ github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          kubectl apply -f k8s/dependencies.yaml
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl rollout status deployment/redis --timeout=120s

      - name: Create TLS secret
        run: |
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout tls.key -out tls.crt -subj "/CN=rick-morty.local"
          kubectl create secret tls rick-morty-tls --cert=tls.crt --key=tls.key

      - name: Deploy Helm chart
        run: |
          helm upgrade --install rick-morty ./helm/rick-morty-api \
            --set image.repository=$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            --set secrets.databaseUrl=postgresql+psycopg2://app:app@postgres:5432/rickmorty \
            --set secrets.redisUrl=redis://redis:6379/0

      - name: Wait for rollout
        run: kubectl rollout status deployment/rick-morty-api --timeout=180s

      - name: Port-forward service
        run: |
          kubectl port-forward svc/rick-morty-api 8000:80 &
          sleep 5

      - name: Integration tests
        env:
          BASE_URL: http://localhost:8000
        run: pytest tests/test_api.py
