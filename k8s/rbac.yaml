apiVersion: v1
kind: ServiceAccount
metadata:
  name: rick-morty-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rick-morty-role
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rick-morty-rolebinding
subjects:
  - kind: ServiceAccount
    name: rick-morty-sa
roleRef:
  kind: Role
  name: rick-morty-role
  apiGroup: rbac.authorization.k8s.io
