apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rick-morty-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - rick-morty.local
      secretName: rick-morty-tls
  rules:
    - host: rick-morty.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rick-morty-api
                port:
                  number: 80
