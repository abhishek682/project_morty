{{- if and .Values.secrets.create (eq .Values.secrets.existingSecret "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-secret
type: Opaque
stringData:
  RM_DATABASE_URL: "{{ .Values.secrets.databaseUrl }}"
  RM_REDIS_URL: "{{ .Values.secrets.redisUrl }}"
{{- end }}
