apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-config
data:
  RM_CACHE_TTL_SECONDS: "{{ .Values.config.cacheTtlSeconds }}"
  RM_SYNC_INTERVAL_SECONDS: "{{ .Values.config.syncIntervalSeconds }}"
  RM_RATE_LIMIT_PER_MINUTE: "{{ .Values.config.rateLimitPerMinute }}"
  RM_OTEL_SERVICE_NAME: "{{ .Values.config.otelServiceName }}"
