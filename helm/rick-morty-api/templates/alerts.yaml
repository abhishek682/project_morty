{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-alerts
spec:
  groups:
    - name: rick-morty-api.rules
      rules:
        - alert: RickMortyHighErrorRate
          expr: |
            (sum(rate(rm_requests_total{status=~"5.."}[5m])) / sum(rate(rm_requests_total[5m]))) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High 5xx rate detected
        - alert: RickMortyHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(rm_request_latency_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 95th percentile latency above 1s
        - alert: RickMortyCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{pod=~"rick-morty-api.*"}[10m]) > 3
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Pod restart storm detected
{{- end }}
