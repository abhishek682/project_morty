apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name  tail
        Path  /var/log/app/app.log
        Tag   app.log
        Refresh_Interval 5

    [OUTPUT]
        Name  stdout
        Match *
  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
