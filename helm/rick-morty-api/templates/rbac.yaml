{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-role
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rick-morty-api.fullname" . }}-rolebinding
subjects:
  - kind: ServiceAccount
    name: {{ include "rick-morty-api.fullname" . }}-sa
roleRef:
  kind: Role
  name: {{ include "rick-morty-api.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
